[package]
name = "later"
version = "0.1.0"
edition = "2021"

[lib]
name = "later_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["default-tls", "json"] }
regex = "1"
tokio = { version = "1", features = ["full"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
# Gmail OAuth (PKCE) — sha256 for the code_challenge, base64 for verifier +
# challenge encoding, rand for verifier + state randomness, keyring for
# macOS Keychain storage of the refresh_token.
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
keyring = { version = "3", features = ["apple-native"] }
